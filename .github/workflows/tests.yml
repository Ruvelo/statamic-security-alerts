name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  quality:
    name: Code style and static analysis
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: pdo_sqlite, mbstring, intl, gd
          coverage: none

      # ruvelo/laravel-security-alerts is on GitHub but not yet on Packagist.
      - name: Find laravel-security-alerts
        run: composer config repositories.lsa vcs https://github.com/Ruvelo/laravel-security-alerts

      - name: Install dependencies
        run: composer update --prefer-dist --no-interaction --no-progress

      - name: Code style
        run: vendor/bin/pint --test

      - name: Static analysis
        run: vendor/bin/phpstan analyse --memory-limit=1G --no-progress

  tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.3', '8.4']
        include:
          - { statamic: '5.*', laravel: '12.*', testbench: '10.*' }
          - { statamic: '6.*', laravel: '12.*', testbench: '10.*' }
          - { statamic: '6.*', laravel: '13.*', testbench: '11.*' }

    name: PHP ${{ matrix.php }} · Statamic ${{ matrix.statamic }} · Laravel ${{ matrix.laravel }}

    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: pdo_sqlite, mbstring, intl, gd
          coverage: none

      - name: Find laravel-security-alerts
        run: composer config repositories.lsa vcs https://github.com/Ruvelo/laravel-security-alerts

      - name: Install dependencies
        run: |
          composer require "statamic/cms:${{ matrix.statamic }}" "laravel/framework:${{ matrix.laravel }}" --no-interaction --no-update
          composer require --dev "orchestra/testbench:${{ matrix.testbench }}" --no-interaction --no-update
          composer update --prefer-stable --prefer-dist --no-interaction --no-progress

      - name: Run tests
        run: vendor/bin/phpunit
